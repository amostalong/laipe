[package]
name = "laipe-vanilla-rust-example"
description = "Vanilla Rust example — chat completion over stdin/stdout with tool calls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
laipe-core = { path = "../../crates/laipe-core" }
laipe-streaming = { path = "../../crates/laipe-streaming" }
laipe-tokio = { path = "../../crates/laipe-tokio" }

tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "laipe-vanilla-rust"
path = "src/main.rs"
