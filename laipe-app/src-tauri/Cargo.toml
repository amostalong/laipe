[package]
name = "laipe-app"
version = "0.1.0"
description = "laipe app — Tauri 2 desktop app with Vue 3 frontend and Rust + laipe streaming backend. The laipe starter."
authors = ["amostalong"]
edition = "2021"
rust-version = "1.70"
license = "MIT"
repository = "https://github.com/amostalong/laipe"
default-run = "laipe-app"

# The `_lib` suffix may seem redundant but is necessary for the
# mobile target (iOS, Android) to compile.
[lib]
name = "laipe_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# laipe — the framework this app showcases.
laipe-core = { path = "../../crates/laipe-core" }
laipe-streaming = { path = "../../crates/laipe-streaming" }
laipe-tokio = { path = "../../crates/laipe-tokio" }

# HTTP client for model catalog refresh (laipe_streaming::model_catalog
# accepts &reqwest::Client; the host builds one)
reqwest = { workspace = true }

# Workspace-shared deps
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

# Time — used by the sample `get_current_time` tool. Production apps would
# swap this for a real tool set, but chrono keeps the demo self-contained.
chrono = { workspace = true }

# Tauri 2 doesn't depend on tracing-subscriber directly; add it ourselves
# for `RUST_LOG=laipe=info` filtering.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
